<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitConnect — Rechtliches</title>
<style>
  :root { --brand: #2FAE60; --text: #1A1D1F; --text-secondary: #5B6168; --bg: #FFFFFF; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 420px; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; font-size: 18px; margin-bottom: 24px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
  h1 { font-size: 22px; margin: 0 0 12px; }
  p { color: var(--text-secondary); font-size: 15px; line-height: 1.6; }
  a.link { display: inline-block; margin-top: 16px; color: var(--brand); font-weight: 600; text-decoration: none; }
  a.link:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span> FitConnect</div>
    <h1>Rechtliche Informationen</h1>
    <p>Hier findest du die rechtlichen Dokumente für die FitConnect-App.</p>
    <a class="link" href="./privacy/">Datenschutzerklärung →</a>
  </div>
</body>
</html>
