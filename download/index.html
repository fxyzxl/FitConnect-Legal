<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KONNEQTD herunterladen</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0B0D">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <script src="../assets/js/config.js"></script>
  <script>
    // Zentrale Download-URL für QR-Codes: leitet je nach Gerät in den passenden Store weiter.
    // Ohne gültigen Store-Link bleibt die Seite mit beiden Buttons stehen.
    (function () {
      var storeUrl = window.FITCONNECT_STORE_URL;
      // „Kommt bald“-Hinweis, solange mindestens ein Store-Link fehlt oder ungültig ist.
      // Wird vor dem Rendern gesetzt, damit der Hinweis nicht kurz aufblitzt.
      var pending = !storeUrl || !storeUrl("ios") || !storeUrl("android");
      document.documentElement.classList.toggle("stores-pending", pending);
      if (!storeUrl) return;
      var ua = navigator.userAgent || "";
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var target = isIOS ? storeUrl("ios") : isAndroid ? storeUrl("android") : "";
      if (target) window.location.replace(target);
    })();
  </script>
</head>
<body>
  <main class="container" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; padding-block: 48px">
    <a class="brand" href="../" aria-label="KONNEQTD – Startseite">
      <img src="../assets/img/logo-mark-129.webp" alt="" width="56" height="42">
      <span class="wordmark">KONNE<span class="accent">Q</span>TD</span>
    </a>
    <h1 style="font-size: clamp(32px, 6vw, 48px)">Dein Gym.<br><span class="accent">Deine Connections.</span></h1>
    <section class="store-notice" aria-labelledby="store-notice-title">
      <h2 id="store-notice-title">KONNEQTD kommt bald!</h2>
      <p>Wir bereiten gerade den Start vor. Sobald die App verfügbar ist, kannst du sie hier kostenlos herunterladen.</p>
    </section>
    <div class="store-buttons" style="justify-content: center">
      <a class="store-btn" data-store="ios" href="#" aria-label="Laden im App Store">
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
        <span class="store-text"><span class="store-small">Laden im</span><span class="store-big">App Store</span></span>
      </a>
      <a class="store-btn" data-store="android" href="#" aria-label="Jetzt bei Google Play">
        <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
        <span class="store-text"><span class="store-small">Jetzt bei</span><span class="store-big">Google Play</span></span>
      </a>
    </div>
  </main>
  <script src="../assets/js/main.js" defer></script>
</body>
</html>
